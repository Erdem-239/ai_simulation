<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Erdem'in gezegeni</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html.wh-in:before{content:"";position:fixed;inset:0;z-index:99999;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff,#dfe6ff 55%,#8aa0ff);animation:whOut 1s ease-out forwards}
@keyframes whOut{0%{opacity:1}100%{opacity:0;visibility:hidden}}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070b24;color:#fff;font-family:Inter,system-ui,sans-serif}
#scene{position:fixed;inset:0;transform-origin:50% 50%;will-change:transform}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fg{pointer-events:none;z-index:4;filter:blur(1.6px)}
/* TV */
#tv{position:absolute;left:0;z-index:2;width:var(--tv);height:calc(var(--tv)*.82);transform:translateX(-50%)}
#tv .ant{position:absolute;bottom:97%;width:calc(var(--tv)*.008);height:calc(var(--tv)*.3);background:linear-gradient(90deg,#8d97ad,#e9eefb 45%,#5b6580);border-radius:3px;transform-origin:50% 100%}
#tv .ant:after{content:"";position:absolute;left:50%;top:-3px;width:calc(var(--tv)*.022);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8d97ad 60%,#4a5368);transform:translate(-50%,-30%)}
#tv .ant.a{left:40%;transform:rotate(-27deg)}#tv .ant.b{left:55%;transform:rotate(23deg)}
#tv .dome{position:absolute;left:44%;bottom:96%;width:14%;height:3.5%;border-radius:50% 50% 0 0;background:linear-gradient(#586278,#1b2231)}
#tv .body{position:absolute;inset:0;border-radius:calc(var(--tv)*.085);background:linear-gradient(145deg,#3a4a5e 0%,#1a2434 28%,#0c121c 60%,#222f43 100%);box-shadow:inset 0 calc(var(--tv)*.005) 0 rgba(255,255,255,.22),inset 0 calc(var(--tv)*-.012) calc(var(--tv)*.02) rgba(0,0,0,.55),0 calc(var(--tv)*.03) calc(var(--tv)*.07) rgba(0,0,0,.75),0 0 calc(var(--tv)*.35) rgba(255,160,80,.28)}
#tv .body:before{content:"";position:absolute;inset:3%;border-radius:calc(var(--tv)*.07);background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 40%,rgba(0,0,0,.25));pointer-events:none}
#tv .feet:before,#tv .feet:after{content:"";position:absolute;bottom:-5%;width:11%;height:7%;background:linear-gradient(#10151f,#06090f);border-radius:0 0 45% 45%}
#tv .feet:before{left:13%}#tv .feet:after{right:13%}
#tv .screen{position:absolute;left:6.5%;top:8%;width:67%;height:84%;border-radius:calc(var(--tv)*.05)/calc(var(--tv)*.055);overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#fffbe8 0,#ffe4b0 38%,#f6b868 78%,#d9843d 100%);box-shadow:0 0 0 calc(var(--tv)*.012) #05080e,0 0 0 calc(var(--tv)*.02) #263349,0 0 calc(var(--tv)*.18) calc(var(--tv)*.05) rgba(255,175,95,.9),inset 0 0 calc(var(--tv)*.08) rgba(110,45,0,.6);animation:fl 4.5s infinite}
@keyframes fl{0%,100%{filter:brightness(1)}41%{filter:brightness(.96)}45%{filter:brightness(1.07)}}
#tv .screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(90,40,0,.07) 0 1px,transparent 1px 3px),linear-gradient(125deg,rgba(255,255,255,.55) 0,rgba(255,255,255,.12) 18%,transparent 34%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(80,30,0,.35) 100%)}
#tv .panel{position:absolute;right:3%;top:9%;width:19%;height:82%;display:flex;flex-direction:column;align-items:center;gap:5%;padding-top:3%}
#tv .grille{width:78%;height:30%;border-radius:8px;background:repeating-linear-gradient(0deg,#05080e 0 2px,#1d2738 2px 4px);box-shadow:inset 0 0 6px #000}
#tv .knob{width:62%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 200deg,#cfd6e6,#59647c,#d8deec,#3a4358,#cfd6e6);box-shadow:0 2px 4px #000,inset 0 0 0 calc(var(--tv)*.008) rgba(0,0,0,.45)}
#tv .brand{margin-top:auto;padding:2px 5px;border-radius:3px;background:linear-gradient(#b8c0d4,#6d7790);color:#0b1020;font:600 calc(var(--tv)*.02)/1 "JetBrains Mono",monospace;letter-spacing:.14em}
#guide{position:absolute;inset:0;padding:5.5% 6.5%;color:#3b2208;font-family:"JetBrains Mono",monospace;font-size:calc(var(--tv)*.04);display:flex;flex-direction:column}
#guide .hd{display:flex;justify-content:space-between;font-weight:500;letter-spacing:.12em;font-size:.72em;opacity:.8;border-bottom:1px solid rgba(60,30,0,.35);padding-bottom:.45em;margin-bottom:.45em}
#guide .rows{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:.1em}
#guide .r{display:flex;gap:.7em;padding:.3em .55em;border-radius:.3em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guide .r b{opacity:.55;font-weight:400}
#guide .r.on{background:#3b2208;color:#ffe9c2}#guide .r.on b{opacity:.8}
#guide .ft{margin-top:.4em;opacity:.7;font-size:.66em;display:flex;justify-content:space-between}
#noise{position:absolute;inset:0;opacity:0;pointer-events:none;background:repeating-radial-gradient(circle at 20% 30%,#fff 0 1px,#222 1px 2px)}
#noise.on{opacity:.85;animation:ns .12s steps(2) infinite}
@keyframes ns{0%{background-position:0 0}100%{background-position:7px 5px}}
#ir{position:absolute;z-index:5;width:10px;height:10px;pointer-events:none}
#ir i{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,190,120,.9);opacity:0;transform:scale(.1)}
#ir.go i{animation:ir .9s ease-out forwards}#ir.go i:nth-child(2){animation-delay:.15s}#ir.go i:nth-child(3){animation-delay:.3s}
@keyframes ir{0%{opacity:.9;transform:scale(.1)}100%{opacity:0;transform:scale(5)}}
/* arayüz */
#ttl{position:fixed;z-index:6;left:0;right:0;top:3.5vh;text-align:center;pointer-events:none;padding:0 16px}
#ttl h1{margin:0;font:italic 400 clamp(30px,5vw,68px)/1.02 "Instrument Serif",Georgia,serif;text-shadow:0 2px 30px rgba(10,10,40,.55)}
#ttl p{margin:.5em 0 0;font-size:clamp(13px,1.6vw,19px);opacity:.78;font-weight:300}
#back{position:fixed;z-index:7;left:16px;top:16px;color:#fff;text-decoration:none;font-size:13px;padding:8px 14px;border-radius:999px;background:rgba(10,12,28,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2)}
#toast{position:fixed;z-index:8;left:50%;bottom:90px;transform:translate(-50%,10px);padding:10px 18px;border-radius:999px;background:rgba(20,16,40,.7);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);font-size:14px;opacity:0;transition:.35s;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
#rem{position:fixed;z-index:7;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;align-items:center;background:rgba(10,12,28,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:10px 12px}
#rem button{width:46px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:500 14px Inter;cursor:pointer}
#rem button:hover{background:rgba(255,255,255,.2)}
#rem small{font-size:10px;letter-spacing:.14em;opacity:.6}
@media(max-width:700px){#ttl{top:10vh}}
#white{position:fixed;inset:0;z-index:99998;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
</style>
<script>try{if(sessionStorage.getItem('wh')){sessionStorage.removeItem('wh');document.documentElement.classList.add('wh-in')}}catch(e){}</script>
</head>
<body>
<div id="scene">
  <canvas id="bg"></canvas>
  <div id="tv"><i class="ant a"></i><i class="ant b"></i><i class="dome"></i><div class="body"></div><div class="screen"><div id="guide"></div><div id="noise"></div></div><div class="panel"><div class="grille"></div><div class="knob"></div><div class="knob"></div><div class="brand">ERDEM</div></div><div class="feet"></div></div>
  <div id="ir"><i></i><i></i><i></i></div>
  <canvas id="fg"></canvas>
</div>
<div id="ttl"><h1>Bu benim gezegenim.</h1><p>Kumandayı al, bir alan seç.</p></div>
<a id="back" href="./">← Ana sayfa</a>
<div id="rem"><small>KUMANDA</small><button id="up" aria-label="Yukarı">▲</button><button id="ok">OK</button><button id="dn" aria-label="Aşağı">▼</button></div>
<div id="toast"></div><div id="white"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const CH=[['Yapay Zekâ','yz'],['Veri Bilimi',''],['Bilgisayar Bilimi',''],['Elektrik-Elektronik',''],['Blog','blog'],['Ana Sayfa','home']];
const VIS=5;let sel=0,opening=false;
const gd=$('guide');
function draw(){const top=Math.max(0,Math.min(CH.length-VIS,sel-3));let h='<div class="hd"><span>ALANLAR</span><span>CH '+String(sel+1).padStart(2,'0')+'</span></div><div class="rows">';
  for(let i=top;i<top+VIS;i++){h+='<div class="r'+(i===sel?' on':'')+'" data-i="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b>'+CH[i][0]+'</div>'}
  h+='</div><div class="ft"><span>▲▼ kanal</span><span>OK aç</span></div>';gd.innerHTML=h}
draw();
const ir=$('ir');function pulse(){press=performance.now();ir.classList.remove('go');void ir.offsetWidth;ir.classList.add('go')}
function move(d){if(opening)return;sel=(sel+d+CH.length)%CH.length;draw();pulse()}
function open(){if(opening)return;pulse();const key=CH[sel][1];if(!key){const t=$('toast');t.textContent=CH[sel][0]+' kanalı yakında yayında.';t.classList.add('on');clearTimeout(open.t);open.t=setTimeout(()=>t.classList.remove('on'),2200);return}opening=true;$('noise').classList.add('on');
  setTimeout(()=>{$('noise').classList.remove('on');const sc=document.querySelector('#tv .screen').getBoundingClientRect(),cx=sc.left+sc.width/2,cy=sc.top+sc.height/2,k=Math.max(innerWidth/sc.width,innerHeight/sc.height)*1.05,s=$('scene');
    s.style.transformOrigin=cx+'px '+cy+'px';s.style.transition='transform .95s cubic-bezier(.6,0,.9,.4)';s.style.transform='scale('+k+')';
    setTimeout(()=>{$('white').style.opacity=1},650);
    setTimeout(()=>{try{sessionStorage.setItem('wh','1')}catch(e){}location.href=key==='home'?'./':key==='blog'?'blog/':'yapay-zeka/index.html'},1050)},650)}
gd.addEventListener('click',e=>{const r=e.target.closest('.r');if(!r)return;sel=+r.dataset.i;draw();open()});
gd.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY>0?1:-1)},{passive:false});
$('up').onclick=()=>move(-1);$('dn').onclick=()=>move(1);$('ok').onclick=open;
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();move(-1)}else if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();move(1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
addEventListener('pageshow',e=>{if(e.persisted){opening=false;const s=$('scene');s.style.transition='none';s.style.transform='';$('white').style.opacity=0}});

/* ---------- manzara ---------- */
var press=-1e9;
const bg=$('bg'),g=bg.getContext('2d'),fg=$('fg'),f=fg.getContext('2d'),tv=$('tv');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,rnd=Math.random;
let bok=[],W=0,H=0,dpr=1,TX=0,TY=0,S=10,PX=0,TRX=0,blades=[],front=[],stars=[],clouds=[],flies=[],pts=[],leaves=[],specks=[],lights=[],ss=null,nextSS=4;
const hill=x=>H*.79-H*.13*Math.cos((x/W-.62)*Math.PI*1.25)+H*.012*Math.sin(x/W*14)+H*.008*Math.sin(x/W*31);
const mt=(x,k)=>Math.sin(x*(2.1+k)+k*3)*.5+Math.sin(x*(5.3+k)+k)*.3+Math.sin(x*(11+k*2))*.2;
const wind=(x,t)=>Math.max(0,.42+.16*Math.sin(t*.35)+.22*Math.sin(x*.005-t*1.0)+.06*Math.sin(x*.02-t*2.2));
function layout(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;const M=W<700;
  [bg,fg].forEach(c=>{c.width=W*dpr;c.height=H*dpr});g.setTransform(dpr,0,0,dpr,0,0);f.setTransform(dpr,0,0,dpr,0,0);
  const tvw=M?W*.58:Math.min(W*.2,H*.34);document.documentElement.style.setProperty('--tv',tvw+'px');
  TX=W*(M?.66:.64);const hy=hill(TX);tv.style.left=TX+'px';tv.style.bottom=(H-hy-tvw*.03)+'px';TY=hy-tvw*.82*.5;
  S=Math.min(H*.0145,W*.026);PX=W*(M?.17:.27);TRX=PX-7*S;
  const py=hill(PX);ir.style.left=(PX+7.8*S)+'px';ir.style.top=(py-7.4*S)+'px';
  const nb=M?1200:2600;blades=[];for(let i=0;i<nb;i++){const x=rnd()*W,h2=hill(x),y=h2+Math.pow(rnd(),1.4)*(H-h2);blades.push({x,y,h:(5+rnd()*16)*(.5+y/H),p:rnd()*6.28,hu:75+rnd()*25,l:15+rnd()*17,w:.8+rnd()*1.1,fl:rnd()<.035?[330,48,55,'#ffc2d8','#fff3c4'][(rnd()*5)|0]:0})}
  front=[];const nf=M?110:260;for(let i=0;i<nf;i++){front.push({x:rnd()*W,h:(30+rnd()*95)*(H/900+.4),p:rnd()*6.28,w:1.4+rnd()*2,l:6+rnd()*14})}
  stars=[];for(let i=0;i<230;i++)stars.push({x:rnd()*W,y:rnd()*H*.5,s:.4+rnd()*1.1,p:rnd()*6.28,v:.6+rnd()*1.8});
  clouds=[];for(let i=0;i<8;i++)clouds.push({x:rnd()*W,y:H*(.1+rnd()*.34),s:W*(.1+rnd()*.14),v:6+rnd()*10,a:.2+rnd()*.22,sd:rnd()*9});
  bok=[];for(let i=0;i<(M?18:34);i++)bok.push({x:rnd()*W,y:H*(.1+rnd()*.7),r:6+rnd()*18,v:4+rnd()*8,p:rnd()*6.28});
  flies=[];for(let i=0;i<26;i++)flies.push({x:rnd()*W,y:H*(.58+rnd()*.38),p:rnd()*6.28,v:.3+rnd()*.7});
  pts=[];for(let i=0;i<(M?60:120);i++)pts.push({x:rnd()*W,y:H*(.2+rnd()*.7),v:.5+rnd()*1.1,p:rnd()*6.28,k:rnd()<.45?0:rnd()<.6?1:2,r:rnd()*6.28,z:1+rnd()*2.2});
  // ağaç yaprakları
  leaves=[];const R=21*S;for(let i=0;i<60;i++){const a=rnd()*6.283,d=Math.sqrt(rnd())*R;leaves.push({ox:Math.cos(a)*d*1.05,oy:Math.sin(a)*d*.8,r:(3.2+rnd()*4.5)*S,ph:rnd()*6.28})}
  leaves.sort((a,b)=>a.oy-b.oy);
  specks=[];for(let i=0;i<900;i++){const a=rnd()*6.283,d=Math.sqrt(rnd())*R*1.12;specks.push({ox:Math.cos(a)*d*1.08,oy:Math.sin(a)*d*.85,ph:rnd()*6.28,c:rnd()})}
  lights=[];for(let i=0;i<34;i++)lights.push({x:rnd(),dy:6+rnd()*34,a:.5+rnd()*.5,p:rnd()*6.28});
}
layout();addEventListener('resize',layout);
function limb(a,b,w,st){g.strokeStyle=st;g.lineWidth=w;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
function person(t,py,w,now){
  const s=S,x=PX,P=(u,v)=>[x+u*s,py+v*s],pr=Math.max(0,1-(now-press)/260);
  // gölge
  g.fillStyle='rgba(0,0,0,.32)';g.beginPath();g.ellipse(x+3*s,py+.2*s,9*s,1.1*s,0,0,6.283);g.fill();
  const jk=g.createLinearGradient(x-3*s,0,x+10*s,0);jk.addColorStop(0,'#111a2f');jk.addColorStop(.55,'#2d375b');jk.addColorStop(1,'#a66f5b');
  const pn=g.createLinearGradient(x-3*s,0,x+11*s,0);pn.addColorStop(0,'#0e121c');pn.addColorStop(.6,'#232b42');pn.addColorStop(1,'#845a4a');
  g.lineCap='round';g.lineJoin='round';
  const H0=P(.4,-1.4),S0=P(-.5,-8.3),K1=P(5.8,-4.6),F1=P(7.7,-.9),K2=P(5.6,-1.8),F2=P(9.8,-.9);
  // arka bacak + ayakkabı
  limb(H0,K2,2.5*s,pn);limb(K2,F2,2*s,pn);g.fillStyle='#1b1722';g.beginPath();g.ellipse(F2[0]+.7*s,F2[1]+.05*s,1.5*s,.8*s,0,0,6.283);g.fill();
  // gövde
  limb(H0,S0,4.3*s,jk);
  // ön bacak
  limb(H0,K1,2.6*s,pn);limb(K1,F1,2.1*s,pn);g.fillStyle='#241d2a';g.beginPath();g.ellipse(F1[0]+.6*s,F1[1]+.05*s,1.5*s,.85*s,0,0,6.283);g.fill();
  // ceket etek dalgalanması
  g.fillStyle=jk;g.beginPath();g.moveTo(...P(-1,-1.2));g.quadraticCurveTo(...P(1.8,-.4+Math.sin(t*5)*.25),...P(2.6+w*.9,-2.2+Math.sin(t*6)*.3));g.lineTo(...P(.7,-3));g.fill();
  // kol: omuz → dirsek → el (basınca hafif sıçrar)
  const E=P(3.3,-6.2),Hd=P(6+pr*.3,-6.6+pr*.25);
  limb(S0,E,1.9*s,jk);limb(E,Hd,1.6*s,jk);
  // kumanda
  g.save();g.translate(Hd[0],Hd[1]);g.rotate(-.42);g.fillStyle='#0b0d14';g.beginPath();g.roundRect(-.4*s,-.55*s,2.9*s,1.1*s,.35*s);g.fill();
  g.fillStyle='#3b4258';g.fillRect(.1*s,-.35*s,1.3*s,.25*s);g.fillStyle='rgba(255,70,50,'+(.55+pr*.45)+')';g.beginPath();g.arc(2.15*s,0,.2*s+pr*.12*s,0,6.283);g.fill();g.restore();
  // el
  g.fillStyle='#c9906f';g.beginPath();g.arc(Hd[0]-.15*s,Hd[1]+.15*s,.72*s,0,6.283);g.fill();
  // boyun + atkı
  limb(P(-.2,-9),P(.1,-10),1.2*s,'#b98262');
  const sc=['#9a3248','#d4586a'];
  for(let k=0;k<2;k++){g.strokeStyle=sc[k];g.lineWidth=(k?.35:.75)*s;g.beginPath();const sy=P(.1,-9.1)[1];g.moveTo(...P(-.7,-9.2));g.quadraticCurveTo(x+(1.5+w*1.4)*s,sy+Math.sin(t*6+k)*.5*s,x+(3.2+w*4.2)*s,sy+(.6+Math.sin(t*7.5+k)*.9*w)*s+k*.15*s);g.stroke()}
  // kafa
  const C=P(.3,-11.1),hg=g.createRadialGradient(C[0]+.9*s,C[1]-.2*s,.2*s,C[0],C[1],1.9*s);hg.addColorStop(0,'#f0b890');hg.addColorStop(1,'#8e5c46');
  g.fillStyle=hg;g.beginPath();g.arc(C[0],C[1],1.65*s,0,6.283);g.fill();
  // yüz detayı (profil: burun, göz)
  g.fillStyle='#9a644c';g.beginPath();g.moveTo(C[0]+1.5*s,C[1]-.1*s);g.lineTo(C[0]+2.05*s,C[1]+.35*s);g.lineTo(C[0]+1.5*s,C[1]+.45*s);g.fill();
  g.fillStyle='#1a100c';g.beginPath();g.arc(C[0]+1*s,C[1]-.3*s,.14*s,0,6.283);g.fill();
  // saç: kalıp + rüzgârda savrulan teller
  g.fillStyle='#17100e';g.beginPath();g.arc(C[0]-.1*s,C[1]-.15*s,1.78*s,Math.PI*.55,Math.PI*1.88);g.lineTo(C[0]+.6*s,C[1]-1.2*s);g.fill();
  g.strokeStyle='#1d1412';g.lineWidth=Math.max(1,.2*s);
  for(let i=0;i<16;i++){const a=Math.PI*(1.05+i*.05),bx=C[0]+Math.cos(a)*1.7*s,by=C[1]+Math.sin(a)*1.7*s,L=(1.2+w*2.8)*s*(.7+.5*Math.sin(i*1.7));
    g.beginPath();g.moveTo(bx,by);g.quadraticCurveTo(bx+L*.5,by-.3*s+Math.sin(t*5+i)*.4*s,bx+L,by+(Math.sin(t*6.5+i*.8)*.6+.2)*s);g.stroke()}
  // TV tarafından sıcak kenar ışığı
  g.globalCompositeOperation='lighter';const rl=g.createRadialGradient(TX,TY,0,TX,TY,W*.55),k=.12;
  g.globalCompositeOperation='source-over';
}
function tree(t,py){
  const s=S,x=TRX,w=wind(x,t),ht=30*s;
  // gövde
