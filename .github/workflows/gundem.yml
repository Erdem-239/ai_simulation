name: Günlük gündem bülteni
on:
  schedule:
    - cron: '30 4 * * *'   # her gün ~07:30 TR
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bulten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Bülteni üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SOCIALDATA_API_KEY: ${{ secrets.SOCIALDATA_API_KEY }}
        run: python3 tools/gundem-bulten.py
      - name: Değişiklik varsa commit'le
        run: |
          if ! git diff --quiet blog/gundem/index.json; then
            git config user.name "gundem-bot"; git config user.email "gundem-bot@users.noreply.github.com"
            git add blog/gundem/index.json
            git commit -m "Gündem: günlük bülten"
            git push
          fi
