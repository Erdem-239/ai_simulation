<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minik GPT Haritası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Düzen: sonsuz beyaz tuval. Her adım = sol ana kart + sağda dallanan not kartları, aralarında aşağı ok. */
:root{
  --bg:#fbfbf8; --dot:#dcdfe6; --card:#ffffff; --ink:#1b2130; --mute:#586073; --line:#d6dae3;
  --blue:#2b6bd6; --teal:#0d8a86; --amber:#b4731a; --violet:#7a4cc0; --red:#c23c4b; --gray:#5d6678; --hl:#e0a400;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --panel:#ffffffee;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --dot:#262b37; --card:#1a1f2a; --ink:#e8ebf2; --mute:#9aa3b6; --line:#323a4a;
  --blue:#6ea0ff; --teal:#3fc7c1; --amber:#e8a94d; --violet:#b592f0; --red:#f27a88; --gray:#9aa3b6; --hl:#ffc82e; --panel:#1a1f2aee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --dot:#262b37; --card:#1a1f2a; --ink:#e8ebf2; --mute:#9aa3b6; --line:#323a4a;
  --blue:#6ea0ff; --teal:#3fc7c1; --amber:#e8a94d; --violet:#b592f0; --red:#f27a88; --gray:#9aa3b6; --hl:#ffc82e; --panel:#1a1f2aee; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.3px);background-size:34px 34px}
#vp.dragging{cursor:grabbing}
#vp.dragging *{user-select:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;width:2760px;padding:140px 120px 400px;display:flex;flex-direction:column;gap:0;will-change:transform}
#world.anim{transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.row{display:flex;align-items:flex-start;gap:0;position:relative}
.main{width:1000px;flex:none;background:var(--card);border:2px solid var(--c);border-radius:18px;padding:30px 34px 28px;position:relative;box-shadow:0 2px 0 var(--c)}
.side{width:1480px;flex:none;margin-left:86px;padding-left:0;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:22px 26px;align-content:start;align-items:start}
.side::before{content:"";position:absolute;left:-86px;top:52px;width:86px;border-top:3px dashed var(--c);opacity:.7}
.note{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:20px 24px 20px;position:relative}
.note.wide{grid-column:1/3}
.note::before{content:"";position:absolute;left:-27px;top:34px;width:21px;border-top:3px dashed var(--c);opacity:.55}
.note:nth-child(even)::before{display:none}
.badge{display:inline-flex;align-items:center;gap:8px;font:700 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.badge b{background:var(--c);color:var(--card);border-radius:999px;min-width:30px;height:30px;padding:0 9px;display:inline-grid;place-items:center;font-size:15px;letter-spacing:0}
h2{margin:10px 0 4px;font-size:34px;line-height:1.15;text-wrap:balance}
.sub{margin:0 0 14px;color:var(--mute);font-size:17px}
.say{font-size:18px;line-height:1.5;margin:10px 0}
.say b,.note b{color:var(--ink)}
.note h3{margin:0 0 8px;font-size:19px;line-height:1.25;text-wrap:balance}
.note .tag{display:block;font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.note p{margin:6px 0;font-size:16px;line-height:1.5}
.note ul{margin:6px 0;padding-left:20px;font-size:16px;line-height:1.5}
code,.mono{font-family:var(--mono);font-size:.92em}
.formula{font:600 18px var(--mono);background:color-mix(in srgb,var(--c) 9%,var(--card));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:10px;padding:12px 16px;margin:12px 0;overflow-x:auto;white-space:pre}
.gain{margin-top:16px;padding:12px 16px;border-radius:10px;background:color-mix(in srgb,var(--c) 11%,var(--card));font-size:16.5px;line-height:1.45}
.gain b{color:var(--c)}
.cap{font-size:13.5px;color:var(--mute);margin:4px 0 12px;line-height:1.4}
.vis{margin:12px 0;overflow:visible}
.vis svg{display:block;max-width:none;overflow:visible}
.hv{font:10px var(--mono);fill:var(--ink)}
.hl{font:11px var(--mono);fill:var(--mute)}
.hlb{font:600 12px var(--sans);fill:var(--ink)}
.arr{width:1000px;height:96px;display:flex;justify-content:center;position:relative;color:var(--gray)}
.arr svg{overflow:visible}
.arr span{position:absolute;left:calc(50% + 28px);top:34px;font-size:15px;color:var(--mute);max-width:420px}
table.t{border-collapse:collapse;font-size:15px;width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.t th{background:color-mix(in srgb,var(--c) 8%,var(--card))}
.slots{display:flex;gap:8px;margin:10px 0}
.slot{width:78px;text-align:center}
.slot i{display:block;font:11px var(--mono);color:var(--mute);font-style:normal}
.slot .ch{display:grid;place-items:center;height:62px;border:2px solid var(--line);border-radius:10px;font:700 30px var(--mono);margin:3px 0;background:var(--card)}
.slot .ch.pad{color:var(--mute);background:color-mix(in srgb,var(--gray) 10%,var(--card));font-weight:400}
.slot .id{display:block;font:600 13px var(--mono);border-radius:6px;background:color-mix(in srgb,var(--c) 14%,var(--card));padding:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.chip{border:2px solid var(--cc);border-radius:999px;padding:8px 16px;font:700 15px var(--sans);background:color-mix(in srgb,var(--cc) 10%,var(--card));color:var(--ink);cursor:pointer}
.chip small{font:600 12px var(--mono);color:var(--cc);margin-right:6px}
.pill{display:inline-block;font:600 13px var(--mono);padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,var(--card))}
.eq{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.eq .op{font:700 30px var(--sans);color:var(--mute)}
.win{display:inline-flex;gap:2px;font:600 20px var(--mono)}
.win span{width:28px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px}
.win span.pd{color:var(--mute);background:color-mix(in srgb,var(--gray) 10%,var(--card))}
/* araç çubuğu */
#bar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 24px)}
.bar-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;backdrop-filter:blur(6px)}
.bar-row strong{font-size:14px;padding:0 6px}
.bar-row button,.bar-row a{font:700 14px var(--sans);min-width:38px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:0 10px}
.bar-row button:hover{border-color:var(--blue)}
.bar-row button:focus-visible,.chip:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
#nav{display:none;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;max-height:calc(100vh - 150px);overflow:auto;width:340px;max-width:calc(100vw - 24px)}
#nav.open{display:flex}
#nav button{text-align:left;font:400 14px var(--sans);border:0;background:transparent;color:var(--ink);padding:6px 8px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center}
#nav button:hover{background:color-mix(in srgb,var(--blue) 12%,var(--card))}
#nav button b{min-width:26px;height:26px;border-radius:99px;display:inline-grid;place-items:center;font-size:12px;background:var(--cc);color:var(--card)}
#hint{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mute);max-width:min(440px,calc(100vw - 24px))}
@media (max-width:700px){#hint{display:none}.bar-row strong{display:none}}
@media (prefers-reduced-motion:reduce){#world.anim{transition:none}}
</style>

<div id="vp"><div id="world"></div></div>
<div id="bar">
  <div class="bar-row">
    <a href="../index.html" title="Siteye dön" style="text-decoration:none;display:inline-grid;place-items:center">← Site</a>
    <strong>Minik GPT haritası</strong>
    <button id="zo" title="Uzaklaş" aria-label="Uzaklaş">−</button>
    <button id="zi" title="Yakınlaş" aria-label="Yakınlaş">+</button>
    <button id="fit" title="Hepsini sığdır">Sığdır</button>
    <button id="prev" title="Önceki adım" aria-label="Önceki adım">◀</button>
    <button id="cur" title="Adım listesi">Adımlar</button>
    <button id="next" title="Sonraki adım" aria-label="Sonraki adım">▶</button>
  </div>
  <div id="nav"></div>
</div>
<div id="hint">Tekerlek: yakınlaş/uzaklaş · Sürükle: gez · Çift tık: o adıma odaklan · ◀ ▶ ya da ok tuşları: adım adım</div>

function bars(vals,labels,o={}){

  const mn=Math.min(...vals,0),mx=Math.max(...vals,0),sc=bw/((mx-mn)||1),x0=lw+(-mn)*sc,hgt=vals.length*rh+4;
  let s=`<svg width="${W}" height="${hgt}" viewBox="0 0 ${W} ${hgt}" role="img" aria-label="${esc(o.label||'çubuk grafik')}">`;
  vals.forEach((v,i)=>{const y=i*rh+2,w=Math.abs(v)*sc,x=v>=0?x0:x0-w,hi=(o.hl||[]).includes(i);
    s+=`<text class="hlb" x="${lw-8}" y="${y+rh/2+4}" text-anchor="end" style="${hi?'':'font-weight:400'}">${esc(labels[i])}</text>`;

add({c:'--teal',n:'5',title:'Üç süzgeç: q, K, V',sub:'x tablosunu üç ayrı 16×16 tabloyla çarpıp üç yüz çıkarıyoruz.',

  `<div class="vis" style="display:flex;gap:28px;flex-wrap:wrap">`+['WQ','WK','WV'].map(k=>`<div>${heat(16,16,(r,c)=>DATA[k][r*16+c],{cw:15,ch:15,vmax:mt(DATA[k]),label:k})}<div class="cap">${k.replace('W','W_')} (16×16)</div></div>`).join('')+`</div>`+
  say('Gerçek bir çarpma: <b>q[1]</b>, x[9] ile W_Q\'nun <b>1. sütunu</b>:')+
  `<div class="vis">`+heat(3,16,(rr,c)=>[x9[c],DATA.WQ[c*16],x9[c]*DATA.WQ[c*16]][rr],{cw:46,ch:26,lw:96,val:true,vmax:1.6,rl:i=>['x[9]','W_Q sütun 1','çarpım'][i]})+`</div>`+
  cap(`16 çarpımın toplamı ≈ q[1] = ${f(DATA.q[0],3)} (yuvarlamadan dolayı son hanede küçük fark olabilir).`)+
  say('Sonuçlar: q (tek satır), K ve V (10×16):')+
  `<div class="vis"><div>${vecHeat(DATA.q,{cw:44,ch:26,val:true,dec:1,vmax:3.1,label:'q'})}<div class="cap">q (1×16): yalnızca "="</div></div></div>
   <div class="vis" style="display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start"><div>${heat(10,16,(r,c)=>DATA.K[r*16+c],{cw:22,ch:20,lw:54,rl:i=>'slot '+i,vmax:3.8,label:'K'})}<div class="cap">K (10×16)</div></div>
   <div>${heat(10,16,(r,c)=>DATA.Vm[r*16+c],{cw:22,ch:20,lw:54,rl:i=>'slot '+i,vmax:3.8,label:'V'})}<div class="cap">V (10×16)</div></div></div>`+
  kaz('Aynı x\'ten üç rol: <b>q</b> = "ben ne arıyorum", <b>K</b> = "beni böyle bul", <b>V</b> = "seçilirsem bunu veririm".'),
 notes:()=>[
  note(T,'Kütüphane benzetmesi',`<ul><li><b>q</b>: elindeki not: "toplama için rakam lazım".</li><li><b>K</b>: her kitabın sırtındaki etiket: "ben rakamım", "ben artıyım", "ben boşluğum".</li><li><b>V</b>: kitabın içindeki asıl bilgi.</li></ul><p>Notunu etiketlerle karşılaştırırsın (skor), sonra en uyanlardan içeriği alırsın.</p>`),
  note(T,'K ve V aynı işlemi yapıyor, neden farklı bilgi taşıyorlar?',`<p>İkisi de "x × 16×16 tablo". Başlangıçta fark yok. Fark <b>eğitimde, nerede kullanıldıklarından</b> doğuyor:</p><ul><li><b>K</b> yalnızca skora girer → hata gelince "bulunabilirliği" düzeltmeye iter.</li><li><b>V</b> yalnızca karışıma girer → "taşıdığı bilgiyi" düzeltmeye iter.</li></ul>`),
  note(T,'Neden q yalnızca "=" slotundan?',`<p>Sıradaki karakteri <code>=</code> slotu tahmin edecek. Soruyu o soruyor: <i>"cevabı üretmek için kimin bilgisi lazım?"</i> Diğer slotlar soru sormaz, sadece cevap verir (K ve V). Videoda her kelimenin q'su var, çünkü encoder her kelime için yeni bir kodlama üretiyor; bizde sadece son slotun çıktısı kullanılıyor.</p>`),
  note(V,'14:40 – 20:30: query, key, value',`<table class="t"><tr><th></th><th>Video</th><th>Bizim ağ</th></tr><tr><td>Boyut</td><td>2 sayı</td><td>16 sayı</td></tr><tr><td>Ağırlık seti</td><td>W_Q, W_K, W_V (2×2)</td><td>16×16</td></tr><tr><td>Her kelimeye aynı ağırlık</td><td>evet</td><td>evet</td></tr><tr><td>Kimin q'su</td><td>hepsinin</td><td>sadece son slot</td></tr></table><p>Josh'a Squatch soruyor: "ilk iki sayıyı doğrudan kullansak olmaz mı?" Cevap: yeni değerler her kelimeye bağlam katar, birden çok hücre yığılabilir (multi-head).</p>`),
  note(K,'Kaç çarpma var?',`<table class="t"><tr><th>İş</th><th>Çarpma</th></tr><tr><td>K = x · W_K</td><td>10×16×16 = 2.560</td></tr><tr><td>V = x · W_V</td><td>2.560</td></tr><tr><td>q = x[9] · W_Q</td><td>16×16 = 256</td></tr></table>`),note(T,"K[0] nasıl bulunuyor? K[i] kendi slotuyla mı çarpılıyor?",`<p><b>Hayır, W_K tablosuyla.</b> x[0] (16 sayı), W_K'nın 16 sütununun her biriyle çarpılıp toplanır (her sütun 1 sayı) → <b>K[0] = 16 sayı</b>. Slot 1 için x[1] aynı W_K ile → K[1]. Böyle slot 9'a kadar → K tablosu.</p><div class="mono" style="font-size:14px;line-height:1.6">x[0] × W_K sütun 1 → 1 sayı<br>x[0] × W_K sütun 2 → 1 sayı<br>… 16 sütun → K[0] (16 sayı) → K tablosunun 0. satırı</div><p>Bu adımda <b>slotlar birbiriyle hiç karşılaşmıyor</b>: K[0] yalnızca x[0]'dan çıkıyor. Temas bir sonraki adımda (skor): q her K[i] ile karşılaştırılıyor.</p>`),
  note(T,"W_K ile K aynı şey mi? (W'li olanlar sabit, W'siz olanlar sonuç)",`<table class="t"><tr><th></th><th>Ne</th><th>Şekil</th></tr><tr><td><b>W_K</b></td><td>ağırlık tablosu, eğitimle öğrenilir, soruya göre değişmez</td><td>16×16</td></tr><tr><td><b>K</b></td><td>her soruda x'ten hesaplanan sonuç: K = x × W_K</td><td>10×16</td></tr></table><p>Aynısı W_Q → q ve W_V → V için. <b>W'li = sabit ağırlık, W'siz = hesaplanan sonuç.</b></p>`)]});

// 6 — skor
add({c:'--teal',n:'6',title:'Skor: q · K[i] / 4',sub:'"=" slotunun sorusu her slotun etiketiyle ne kadar uyuşuyor?',
 main:()=>say('q\'yu her slotun K satırıyla nokta çarpıma sokuyoruz (16 çarpma + toplama), sonra <b>4\'e</b> (√16) bölüyoruz. 10 slot → <b>10 skor</b> (toplam 160 çarpma).')+
  fm('s[i] = ( q[1]·K[i][1] + q[2]·K[i][2] + … + q[16]·K[i][16] ) / 4')+
  `<div class="vis">`+bars(DATA.s,cc.map((c,i)=>'slot '+i+'  '+dsp(c)),{w:640,lw:110,vw:90,hl:[6,8],label:'skorlar'})+`</div>`+
  cap('Gerçek skorlar. Sarı çerçeve: 7 ve 5 slotları.')+
  kaz('"Hangi slot, <b>=</b>\'nin aradığına ne kadar benziyor?" ölçüsü. En yüksek skorlar <b>7</b> ve <b>5</b> slotlarında.'),
 notes:()=>[
  note(T,'Skor neyi gösteriyor?',`<p>İki vektör <b>aynı yöne bakıyorsa</b> nokta çarpım büyük pozitif, zıt yöndeyse negatif, alakasızsa sıfıra yakın.</p><p>Videodaki örnek: "the pizza came out of the oven and <b>it</b> tasted good" cümlesinde <i>it</i> kelimesinin <i>pizza</i> ile skoru yüksek, <i>oven</i> ile düşük olmalı. Bizde <code>=</code>'nin <code>7</code> ve <code>5</code> ile skoru yüksek.</p><p><b>Skor yüzde değil, bilgi de değil:</b> sadece "kime bakmalıyım" ölçüsü.</p>`),
  note(T,'Neden 4\'e bölüyoruz?',`<p>16 sayılık çarpımın toplamı büyür. Skorlar çok büyürse softmax tek slota %100 verir ve eğitim kilitlenir. √16 = 4'e bölmek skorları makul tutar. Videoda da aynısı, en sonda: "dot product, embedding sayısının karekökine bölünür".</p>`),
  note(T,'"Yedi artı beş hepsi yüksek skor almış, bununla ne yapıyoruz?"',`<p>Skor tek başına bir şey vermez; bir sonraki adımda <b>ağırlık</b> olarak kullanılıyor: önce yüzdeye çevrilecek (softmax), sonra V'lerle karıştırılacak.</p>`),note(T,"q ile K[9] aynı mı?",`<p><b>Hayır.</b> İkisi de aynı x[9]'dan çıkıyor ama farklı tablolarla: q = x[9] × <b>W_Q</b>, K[9] = x[9] × <b>W_K</b>. İki ayrı tablo, 16 sayı da farklı.</p><p>q, <b>10 slotun hepsinin</b> K'sıyla karşılaştırılıyor; slot 9 (kendisi) dahil. Gerçek skor: <b>−6,6</b> (en düşük), yüzde <b>%0,004</b>: <code>=</code> kendine bakmıyor, kendi bilgisi zaten x[9]'da (residual ile geri ekleniyor).</p>`),
  note(T,"\"= aradığı şey 1 ama 7 ve 5 yüksek çıkıyor\"",`<p>q, <b>cevabın kendisini</b> aramıyor. Pencerede <code>1</code> karakteri yok, olamaz da (bulmaya çalıştığımız o). q şunu soruyor: <i>"cevabı hesaplamak için hangi slotların bilgisi lazım?"</i> Cevap: <b>7 ve 5</b>, yani sorunun girdileri.</p><p><code>1</code> ise attention'dan <b>sonra</b>, FFN ve W_out'un bulduğu çıktı. Matematik sınavında 7+5'in cevabını aramazsın, 7'ye ve 5'e bakarsın.</p>`),
  note(T,"q, 7 ve 5'i diğer slotlardan nasıl ayırt ediyor?",`<p>"7 mi, 5 mi" diye bakmıyor; <b>K satırlarıyla sayı olarak</b> karşılaştırıyor. K[6], E[7]+P[6]'dan; K[8], E[5]+P[8]'den çıkıyor. Karakterler farklı E satırları taşıdığı için K'ları da farklı.</p><p>Eğitim, <b>rakam karakterlerinin K'sını q ile aynı yöne</b>, <code>+</code>, <code>=</code> ve noktalarınkini ters yöne çekmiş. Hiç kimse "7 ve 5" demedi; "rakamlara bak" deseni ağırlıklarda oluştu.</p><p><b>Sınır:</b> ayrımın E'den (karakter) mi P'den (konum) mı geldiğini ölçmedim.</p>`)]});

// 7 — softmax
add({c:'--teal',n:'7',title:'Softmax: skorlar → yüzdeler',sub:'10 skoru toplamı 1 olan yüzdelere çeviriyoruz: "hangi slota ne kadar bakacağım".',
 main:()=>say('Softmax, küçük farkları üstel biçimde büyütür. Sonuç <b>a</b>: 10 yüzde, toplamı %100.')+
  `<div class="vis">`+bars(DATA.a,cc.map((c,i)=>'slot '+i+'  '+dsp(c)),{w:640,lw:110,vw:110,hl:[6,8],color:'var(--teal)',fmt:pc,label:'dikkat yüzdeleri'})+`</div>`+
  `<table class="t"><tr><th>Slot</th>${cc.map((c,i)=>`<th>${i}  <span class="mono">${esc(dsp(c))}</span></th>`).join('')}</tr><tr><td>skor</td>${DATA.s.map(v=>`<td class="mono">${f(v,2)}</td>`).join('')}</tr><tr><td>yüzde</td>${DATA.a.map(v=>`<td class="mono">${pc(v)}</td>`).join('')}</tr></table>`+
  kaz('Artık net bir karar var: <code>=</code> slotu bilgiyi <b>%'+(DATA.a[6]*100).toFixed(0)+'\'si 7\'den, %'+(DATA.a[8]*100).toFixed(0)+'\'i 5\'ten</b> alacak. Burası attention\'ın kalbi: model kime bakacağını <b>kendisi</b> seçiyor.'),
 notes:()=>[
  note(T,'Neden "+" ve "=" değil de 7 ve 5?',`<p><code>+</code>: <b>${pc(DATA.a[7])}</b>, <code>=</code>: <b>${pc(DATA.a[9])}</b>. Cevabı bulmak için <b>sayıların kendisi</b> lazım; <code>+</code> ve <code>=</code> sadece işaret. Ağ bunu eğitimle öğrenmiş.</p><p>Eğitimden önce yüzdeler 10 slota kabaca eşit (≈%10) dağınıktı.</p>`),
  note(V,'17:30 – 19:00: softmax',`<p>"Softmax sıralamayı korur, sayıları 0–1 arasına çevirir ve toplamları 1 olur." Videoda <code>let's</code> kendine %100, <code>go</code>'ya %0 veriyor. Bizde dağılım iki slota yayılıyor (7 ve 5).</p>`),
  note(K,'Skor → yüzde farkı',`<p>Skor: ham, negatif olabilir, toplamı yok. Yüzde: 0–1, toplamı 1. Bir sonraki adımda yüzdeler V'lerle çarpılacak.</p>`),note(Ö,"Başta dikkat dağınık: eğitimle nasıl keskinleşiyor?",`<table class="t"><tr><th>Epoch</th><th>0</th><th>8</th><th>64</th><th>128</th><th>256</th><th>800</th></tr><tr><td>7 + 5 payı</td><td>%21</td><td>%12</td><td>%11</td><td>%59</td><td>%92</td><td>%95</td></tr></table><p><b>Düz bir yükseliş değil:</b> önce <b>düşüyor</b> (dikkat dolgu slotlarına kayıyor), asıl yükseliş epoch 64–256 arasında. Ağ, 7 ve 5'e bakmadan önce başka şeyleri öğreniyor (ör. cevabın hangi karakterle başladığı).</p><p>Ayrıntı ve diğer ölçümler: <a href="epoch.html" target="_blank" rel="noopener">Epoch haritası</a>.</p>`)]});

// 8 — karışım
add({c:'--teal',n:'8',title:'Karışım: a · V  →  o',sub:'Her slotun yüzdesini yalnızca kendi V satırıyla çarpıp, 10 satırı sütun sütun topluyoruz.',
 main:()=>say('Slot i\'nin yüzdesi <b>a[i]</b> tek bir sayı; <b>yalnızca V[i]</b> satırının 16 sayısıyla çarpılır (16 çarpma). 10 slot → <b>160 çarpma</b>. Sonra 10 satır, sütun sütun toplanır → <b>tek satır, 16 sayı: o</b>.')+
  `<div class="vis">`+heat(11,16,(rr,c)=>rr<10?aV[rr*16+c]:DATA.o[c],{cw:46,ch:24,lw:150,th:22,val:true,vmax:3.2,rl:i=>i<10?`a·V[${i}]  ${dsp(cc[i])}  ${pc(DATA.a[i])}`:'TOPLAM = o',cl:c=>c+1,hl:[6,8,10],label:'a·V tablosu ve toplamı'})+`</div>`+
  cap('Gerçek sayılar. 7 ve 5 satırları dolu, diğerleri neredeyse sönük; alttaki o, sütun toplamı.')+
  kaz('<b>o</b> = 10 slottan toplanmış bilgi (ağırlıklı olarak 7 ve 5\'ten): <code>=</code> slotunun "yanımda ne var" bilgisi.'),
 notes:()=>[
  note(T,'1600 çarpım mı? 160 mı?',`<p><b>160.</b> Her slotun elinde tek bir yüzde var ve yalnızca kendi V satırıyla çarpılıyor:</p><div class="mono" style="font-size:14px;line-height:1.6">a[8] × V[8] → 16 çarpma<br>a[7] × V[7] → 16 çarpma<br>… (10 slot) = 160</div><p>"Bir slot 10 satırla çarpılıyor" doğru değil. Tablodaki 160 sayının her biri <b>bir kez</b> çarpılıyor.</p>`),
  note(T,'160 sayı bize ne verdi?',`<p>"Her slotun sunduğu bilgiden, <code>=</code>'nin gerçekten alacağı pay." <b>V[i]</b> sesin kendisi, <b>a[i]</b> ses düğmesinin açıklığı.</p><p>Gerçek tabloda 7 ve 5 satırları baskın, nokta slotları ve <code>+</code>, <code>=</code> neredeyse sıfır.</p>`),
  note(T,'o tablo mu, tek satır mı?',`<p><b>Tek satır, 16 sayı.</b> 10×16 tablo, sütun sütun toplanınca (1. sütunun 10 sayısı → o'nun 1. sayısı, ... 16. sütun → o'nun 16. sayısı) bir satıra iner. Teknik olarak 10 slotun hepsi toplamda var; "7 ve 5'ten gelen bilgi" onun içindeki baskın kısım.</p>`),
  note(V,'18:30 – 19:30: scale + add',`<p>Videoda: "values" hesaplanır, softmax yüzdeleriyle <b>ölçeklenir</b>, sonra <b>toplanır</b> → self-attention değerleri. Bizdeki o, aynı şey.</p>`),note(T,"İlk epoch'ta o neden bulanık?",`<p>Başta yüzdeler yaklaşık eşit (her slota ~%10). O zaman <b>o</b>, 10 slotun bulanık ortalaması: 7 ve 5'in V'leri, dolgu <code>.</code> slotlarının V'leriyle <b>aynı payla</b> karışmış. r ve h bu yüzden "yanımda 7 ve 5 var" bilgisini başta pratikte taşımıyor.</p><p>Yine de sinyal tamamen boş değil (%10'luk pay var); geri yayılım bu zayıf sinyalden doğru yönü buluyor.</p>`)]});

// 9 — W_O + residual
add({c:'--teal',n:'9',title:'W_O ve residual: r = x[9] + o·W_O',sub:'Toplanan bilgiyi "=" slotunun kimlik kartına yapıştırıyoruz.',
 main:()=>say('<b>o</b> (16 sayı) × <b>W_O</b> (16×16 tablo) → yeni 16 sayı (256 çarpma). Sonra bunu <code>=</code>\'nin kendi <b>x[9]</b> satırına sıra sıra ekliyoruz.')+
  `<div class="vis" style="display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap"><div>${heat(16,16,(rr,c)=>DATA.WO[rr*16+c],{cw:15,ch:15,vmax:2,label:'W_O'})}<div class="cap">W_O (16×16)</div></div>
  <div>${heat(4,16,(rr,c)=>[DATA.o,oWO,x9,r][rr][c],{cw:46,ch:28,lw:120,val:true,vmax:3.2,rl:i=>['o','o · W_O','x[9]  (kimlik)','r = x[9] + o·W_O'][i],hl:[3],label:'residual'})}<div class="cap">Gerçek değerler</div></div></div>`+
  kaz('<b>r</b> = kimlik kartı + not: "ben = im, sondayım" <b>ve</b> "yanımda 7 ve 5 var".'),
 notes:()=>[
  note(T,'o ne? x[9] ne?',`<table class="t"><tr><th></th><th>Nereden</th><th>Neyi biliyor</th></tr><tr><td><b>x[9]</b></td><td>E[=] + P[9]</td><td>"Ben = im, sondayım"</td></tr><tr><td><b>o</b></td><td>10 slotun V'sinin yüzdeyle karışımı</td><td>"Yanımda 7 ve 5 var"</td></tr></table><p>Kimlik kartı (x[9]) + kartın üstüne yapıştırılan not (o·W_O) = r.</p>`),
  note(T,'16 sayıyı hangi tabloyla çarptık?',`<p><b>W_O</b> ile: 16 satır × 16 sütun. o'nun 16 sayısı, tablonun <b>her sütunuyla ayrı ayrı</b> çarpılıp toplanır:</p><div class="mono" style="font-size:14px;line-height:1.55">sütun 1: o[1]·W[1][1] + … + o[16]·W[16][1] → çıktı[1]<br>sütun 2: … → çıktı[2]<br>… 16. sütun → çıktı[16]</div><p>Her sütun 16 çarpma, 16 sütun → <b>256 çarpma</b>, sonuç 16 sayı. W_O o'yu x'in "diline" çevirir ki ikisi toplanabilsin.</p>`),
  note(T,'Neden üstüne yazmıyoruz da topluyoruz?',`<p>Yazsaydık <code>=</code>'nin kendi kimliği ve konumu kaybolurdu. Toplayınca ikisi de kalır. Eğitimi de kolaylaştırır: attention işe yaramazsa x[9] r'ye olduğu gibi geçer.</p><p><b>Videoda (22:30):</b> aynı fikir, adı <i>residual connection</i>: "self-attention sadece kelimeler arası ilişkiyi kurmaya odaklansın".</p>`),
  note(K,'Bu 16 sayı okunabilir mi?',`<p>Hayır; her sayının insan diliyle bir anlamı yok. Eğitim, sonraki katmanların (FFN, W_out) işine yarayacak biçimde şekillendiriyor.</p>`),note(T,"o·W_O çarpınca 16×16 tablo mu oluşuyor?",`<p><b>Hayır, tek satır, 16 sayı.</b> (1×16) × (16×16) = (1×16). Her sütunla 16 çarpım yapılıp <b>hemen toplanıyor</b> (256 küçük çarpım var ama tablo olarak saklanmıyor). Sonra tek satır x[9] ile toplanıyor.</p><div class="mono" style="font-size:14px;line-height:1.6">bir sütun: 16 çarpım → toplanır → 1 sayı<br>16 sütun → 16 sayı (o·W_O)</div>`),
  note(T,"Sütun yerine satırla çarpsak?",`<p>Aynı tabloyla farklı sayılar çıkar ama sorun olmaz:</p><div class="mono" style="font-size:14px;line-height:1.6">o = [1, 2], W = [[1, 2], [3, 4]]<br>sütunlarla: [7, 10]<br>satırlarla: [5, 11]</div><p>Satırla çarpmak = <b>tabloyu çevirip (transpoze)</b> sütunla çarpmak. W_O'daki 256 sayı eğitimle bulunduğu için, hangi okumayı seçersen eğitim ona göre ayarlanır; öğrenilebilecek fonksiyon çeşitliliği değişmez. Önemli olan şekil uyumu (W1 16×32 için satır okuması uymaz). Bunu bu modelde deneyle göstermedim, matematiksel olarak anlattım.</p>`)]});

// 10 — FFN
add({c:'--amber',n:'10',title:'FFN: işle, sonra yine ekle',sub:'FFN = Feed-Forward Network (ileri beslemeli ağ). Attention bilgiyi topladı; FFN o bilgiyi yorumlayıp cevaba doğru itiyor.',
 main:()=>say('16 → <b>32</b> → 16. <b>u</b> = r·W1 + b1 (512 çarpma), <b>g</b> = tanh(u), <b>f</b> = g·W2 + b2 (512 çarpma), <b>h</b> = r + f.')+
  fm('r (16) → ×W1 +b1 → u (32) → tanh → g (32) → ×W2 +b2 → f (16) → r + f = h (16)')+
  `<div class="vis">${heat(1,16,(rr,c)=>r[c],{cw:44,ch:26,val:true,vmax:3.2,label:'r'})}<div class="cap">r (16)</div>
  ${heat(2,16,(rr,c)=>DATA.u[rr*16+c],{cw:44,ch:26,lw:70,val:true,dec:1,vmax:11,rl:i=>i?'u[17–32]':'u[1–16]',label:'u'})}<div class="cap">u = r·W1 + b1 (32)</div>
  ${heat(2,16,(rr,c)=>DATA.g[rr*16+c],{cw:44,ch:26,lw:70,val:true,vmax:1,rl:i=>i?'g[17–32]':'g[1–16]',label:'g'})}<div class="cap">g = tanh(u) (32): −1 ile +1 arası</div>
  ${heat(2,16,(rr,c)=>rr?DATA.h[c]:DATA.f[c],{cw:44,ch:26,lw:70,val:true,dec:1,vmax:13,rl:i=>i?'h = r+f':'f',label:'f ve h'})}<div class="cap">f = g·W2 + b2 (16) ve h = r + f (16)</div></div>`+
  kaz('Attention bilgiyi <b>topladı</b>, FFN onu <b>işliyor</b>: "7 ve 5 var, sondayım" bilgisinden "cevap 12, ilk karakter 1" yönüne itiyor. h, <code>=</code> slotunun <b>son hâli</b>.'),
 notes:()=>[
  note(T,'"16 × 32 = 512 çarpma" ne demek? Mini örnek',`<div class="mono" style="font-size:14px;line-height:1.6">r = [1, 2, 3]  ·  W1 (3 satır × 2 sütun):<br>sütun 1 = [1, 2, 3], sütun 2 = [4, 5, 6]<br>sütun 1: 1·1 + 2·2 + 3·3 = <b>14</b><br>sütun 2: 1·4 + 2·5 + 3·6 = <b>32</b><br>bias [1, −2] eklenir → <b>[15, 30]</b></div><p>Gerçekte: r 16 sayı, W1 <b>16 satır × 32 sütun</b>. Her sütun 16 çarpma, 32 sütun → 512 çarpma → 32 sayı. <b>Kural:</b> satır sayısı girdi boyutuna, sütun sayısı çıktı boyutuna eşit.</p>`),
  note(T,'tanh ne yapıyor, neden gerekli?',`<div class="vis">${(()=>{const W=420,H=190,x0=-11,x1=9,px=x=>(x-x0)/(x1-x0)*W,py=y=>H/2-y*H/2*.9;let s=`<svg width="${W}" height="${H}" role="img" aria-label="tanh eğrisi"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)"/><line x1="${px(0)}" x2="${px(0)}" y1="0" y2="${H}" stroke="var(--line)"/>`;let p='';for(let x=x0;x<=x1;x+=.25)p+=(p?'L':'M')+px(x).toFixed(1)+' '+py(Math.tanh(x)).toFixed(1);s+=`<path d="${p}" fill="none" stroke="var(--amber)" stroke-width="2.5"/>`;DATA.u.forEach(u=>{s+=`<circle cx="${px(u)}" cy="${py(Math.tanh(u))}" r="4" fill="var(--ink)" opacity=".65"/>`});return s+'</svg>'})()}</div><p>Noktalar: bu sorudaki 32 gerçek u değeri. <b>${DATA.g.filter(v=>Math.abs(v)>.95).length}/32</b>'si −1 ya da +1'e yapışmış durumda ("anahtar" gibi açık/kapalı).</p><p>tanh olmasa W1 ve W2 çarpımı tek bir çarpmaya indirgenirdi; ağ yalnızca düz ilişkileri öğrenirdi. tanh araya "büküm" koyuyor.</p>`),
  note(T,'Neden 16\'dan 32\'ye çıkıyoruz?',`<p>Daha fazla "bakış açısı": 32 farklı sütun r'ye 32 farklı şekilde bakıyor; sonra W2 tekrar 16'ya indiriyor.</p>`),
  note(T,'Neden yine toplama (h = r + f)?',`<p>r'deki bilgi (kimlik + not) silinmesin, FFN'in bulduğu sonuç üstüne eklensin. Videoda bu bölüm "ekstralar" kısmında: "hidden katmanlı ek sinir ağları eklenebilir".</p>`)]});

// 11 — h
add({c:'--amber',n:'11',title:'h: "=" slotunun son hâli',sub:'Tek bir satır, 16 sayı. Cevap karakterini seçmek için gereken her şey bunun içinde.',
 main:()=>say('h = <b>x[9]</b> (kimlik) + <b>o·W_O</b> (çevre) + <b>f</b> (FFN yorumu). Üç bilgi <b>aynı 16 sayının içinde, üst üste</b>.')+
  `<div class="vis">${heat(4,16,(rr,c)=>[x9[c],oWO[c],DATA.f[c],DATA.h[c]][rr],{cw:46,ch:28,lw:140,val:true,dec:1,vmax:12,rl:i=>['x[9]  kimlik','o·W_O  çevre','f  FFN yorumu','h  toplam'][i],hl:[3],label:'h ve üç parçası'})}</div>`+
  say('<b>Bilgi hangi sayıda?</b> Her h sayısının, 100 farklı toplama sorusu boyunca <b>toplamla (a+b)</b> ilişkisi:')+
  `<div class="vis">${bars(sumCorr,sumCorr.map((_,i)=>'h['+(i+1)+']'),{w:640,lw:56,vw:60,rh:20,color:'var(--amber)',fmt:v=>f(v,2),label:'h sayılarının toplamla korelasyonu'})}</div>`+
  kaz('h tek bir tablo değil, <b>tek satır</b>. Bilgi belli sayılarda toplanmamış; <b>16 sayıya yayılmış (dağıtık)</b>: çoğu sayı toplamla düzenli ilişkili, birkaçı ilişkisiz.'),
 notes:()=>[
  note(T,'h tablo mu, 16 sayı mı?',`<p><b>16 sayı</b>, <code>=</code> slotuna ait tek satır. Tablolarla çarpılan ama kendisi tablo olmayan bir vektör.</p>`),
  note(T,'"Kimlik / çevre / yorum" belli satırlarda mı, rastgele mi?',`<p><b>İkisi de değil.</b> Üçü toplanarak h'ye girdi; 16 sayının her birinde üçünün de payı var. "İlk 5 sayı kimlik" gibi ayrı alanlar yok. Rastgele de değil: çoğu sayı, toplamla düzenli biçimde birlikte artıp azalıyor. Buna <b>dağıtık temsil</b> deniyor.</p><p>(Kimlik / çevre / yorum ayrımı anlatım içindir; ağın kendi içinde böyle kutular yok.)</p>`),
  note(Ö,'Üç parçanın büyüklüğü',`<table class="t"><tr><th>Parça</th><th>Ort. büyüklük</th><th>Sorudan soruya değişiyor mu?</th></tr><tr><td>x[9] (kimlik)</td><td>0,75</td><td><b>Hiç</b></td></tr><tr><td>o·W_O (çevre)</td><td>1,72</td><td>evet (SD 1,65)</td></tr><tr><td>f (FFN)</td><td>5,16</td><td>evet, en çok (SD 2,88)</td></tr><tr><td>h</td><td>6,09</td><td>evet (SD 3,76)</td></tr></table><p>100 soru (<code>0+0=</code> … <code>9+9=</code>) üzerinde ölçüldü. Üç katman eşit büyüklükte değil: h'nin büyük kısmı FFN'den geliyor.</p>`),
  note(Ö,'"Cevabın ilk rakamı 1 mi 0 mı" ile ilişki',`<div class="vis">${bars(tensCorr,tensCorr.map((_,i)=>'h['+(i+1)+']'),{w:520,lw:56,vw:60,rh:18,color:'var(--amber)',fmt:v=>f(v,2),label:'onlar basamağı korelasyonu'})}</div><p>16 sayının <b>10'unda</b> |ilişki| &gt; 0,5. <b>Sınır:</b> yalnızca doğrusal ilişkiye (korelasyon) baktım; tek model, tek tohum.</p>`)]});

// 12 — W_out + softmax
add({c:'--violet',n:'12',title:'W_out + softmax → cevap karakteri',sub:'h\'yi 40 karakterin skoruna çeviriyoruz, en yükseği seçiyoruz.',
 main:()=>say('<b>skor = h · W_out + b_out</b>. W_out 16 satır × 40 sütun; her sütun sözlükteki bir karaktere ait. 40 sütun × 16 çarpma = <b>640 çarpma</b> → 40 skor. Sonra softmax → 40 yüzde.')+
  `<div class="vis">${heat(16,40,(rr,c)=>DATA.Wo[rr*40+c],{cw:19,ch:13,th:18,lw:0,vmax:2,cl:c=>dsp(CH[c]),hlc:[4],label:'W_out'})}<div class="cap">W_out (16×40). Sarı: "1" karakterinin sütunu (id 4).</div></div>`+
  `<div class="vis">${bars(DATA.topL.map(t=>t.logit),DATA.topL.map(t=>'"'+dsp(t.ch)+'"'),{w:620,lw:60,vw:210,hl:[0],color:'var(--violet)',fmt:(v)=>{const t=DATA.topL.find(x=>x.logit===v);return f(v,1)+'  →  '+pc(t.p)},label:'en yüksek 6 skor'})}</div>`+
  cap('En yüksek 6 skor ve softmax sonrası yüzdeleri (gerçek).')+
  kaz('<code>7+5=</code> yazdık, ağ <b>"1"</b> dedi: 12\'nin ilk rakamı. Yüzde: <b>'+pc(DATA.topL[0].p)+'</b>.'),
 notes:()=>[
  note(T,'Her sütun bir karakter, ne demek?',`<p>h'nin 16 sayısı, sütunun 16 sayısıyla çarpılıp toplanıyor. Skor büyükse "h bu karakterin sütununa çok benziyor, cevap bu olabilir". 40 sütun = 40 karakter için 40 skor.</p>`),
  note(T,'%99,99 emin demek doğru demek mi?',`<p>Hayır; sadece kendi tahmininden çok emin demek. Burada doğru çıktı (7+5=12), ama eğitimde hiç görmediği bir toplamda benzer güvenle yanlış cevap da verebilir.</p>`),
  note(K,'Bir sütun nasıl çarpılıyor?',`<p>h[1]·W[1][sütun] + h[2]·W[2][sütun] + … + h[16]·W[16][sütun] + b_out[sütun]. Aynı "satır × sütun" mantığı; artık 40 sütun var.</p>`)]});

// 13 — hata ve eğitim
add({c:'--red',n:'13',title:'Hata ve eğitim: cevabı kim biliyor?',sub:'Ağ cevabı aramıyor. Eğitim kodu, metinden çıkardığı soru-cevap çiftleriyle tahmini kıyaslıyor.',
 main:()=>say('Eğitimden önce metin <b>soru–cevap çiftlerine</b> kesilir (ağdan bağımsız). <code>7+5=12.</code> satırından:')+
  `<table class="t"><tr><th>Soru (X)</th><th>Cevap (Y)</th></tr>${DATA.pairs.map((p,i)=>`<tr style="${i===3?'background:color-mix(in srgb,var(--hl) 30%,var(--card))':''}"><td class="mono">${esc(p.x)}</td><td class="mono"><b>${esc(p.y)}</b></td></tr>`).join('')}</table>`+
  say('Hata = <b>ağın doğru karaktere verdiği yüzdeye</b> bakılarak hesaplanır:')+fm('hata = −ln( p[doğru karakter] )     (yüzde yüksek → hata küçük)')+
  `<table class="t"><tr><th>Epoch</th><th>"1" yüzdesi (7+5= için)</th><th></th><th>Bu sorudaki hata</th><th>Tüm metin ort. hata</th></tr>${DATA.prog.map(p=>`<tr><td>${p.ep}</td><td class="mono">${pc(p.p1)}</td><td style="width:240px"><div style="height:12px;background:var(--violet);width:${Math.max(2,p.p1*230)}px;border-radius:3px"></div></td><td class="mono">${f(p.loss,2)}</td><td class="mono">${f(p.avg,2)}</td></tr>`).join('')}</table>`+
  `<div class="vis">`+`<svg width="900" height="232" viewBox="0 0 900 232" role="img" aria-label="eğitim döngüsü"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="currentColor"/></marker></defs><g style="color:var(--mute)" stroke="currentColor" fill="none" stroke-width="2"><rect x="10" y="20" width="150" height="56" rx="10"/><rect x="10" y="130" width="150" height="56" rx="10"/><rect x="250" y="20" width="170" height="56" rx="10"/><rect x="500" y="20" width="170" height="56" rx="10"/><rect x="500" y="130" width="170" height="56" rx="10"/><rect x="730" y="75" width="160" height="56" rx="10" style="color:var(--red)" stroke="var(--red)"/><path d="M160 48H250" marker-end="url(#ar)"/><path d="M420 48H500" marker-end="url(#ar)"/><path d="M160 158H500" marker-end="url(#ar)"/><path d="M670 48L730 90" marker-end="url(#ar)"/><path d="M670 158L730 116" marker-end="url(#ar)"/><path d="M810 131V200H335V76" stroke-dasharray="6 5" marker-end="url(#ar)"/></g><g class="hlb" text-anchor="middle"><text x="85" y="44">Soru X</text><text x="85" y="62" class="hl">"······7+5="</text><text x="85" y="154">Cevap Y</text><text x="85" y="172" class="hl">metinden, "1"</text><text x="335" y="44">Ağ</text><text x="335" y="62" class="hl">3.576 ağırlık</text><text x="585" y="44">Tahmin p</text><text x="585" y="62" class="hl">40 yüzde</text><text x="585" y="154">p[Y]</text><text x="585" y="172" class="hl">doğruya verilen yüzde</text><text x="810" y="100" style="fill:var(--red)">hata</text><text x="810" y="118" class="hl">−ln p[Y]</text><text x="570" y="222" class="hl" text-anchor="middle">geri yayılım → ağırlıkları düzelt</text></g></svg>`+`</div>`+
  kaz('Ağ cevabı <b>görmüyor</b>; sadece "hata" sinyali alıyor. 800 epoch sonunda ağırlıklar, <code>7+5=</code> girince h\'yi <b>"1"</b> skorunu en yükseğe çıkaracak biçimde ayarlanmış.'),
 notes:()=>[
  note(T,'"Doğru cevabı nasıl bulduğunu anlamadım: neyle kıyaslıyor?"',`<p>Ağ "7+5= metinde var mı?" diye <b>aramıyor</b>, bulamaz da. Cevabı bilen <b>eğitim kodu</b>: her çiftin cevabı (Y) metinden çıkarılıp saklanmış (SM.X, SM.Y).</p><p>Döngü: soruyu ağa ver → tahmin al → cevap listesindeki Y\'ye verilen yüzdeye bak → hatayı geriye akıt. Etiket, metnin kendisinden çıktığı için buna <b>kendi kendine denetim</b> deniyor: insanın ayrıca etiketlemesi gerekmedi.</p>`),
  note(T,'800 epoch ne yapıyor?',`<p>Metinden ${DATA.NS} soru–cevap çifti çıkıyor. Her epoch'ta <b>hepsine bir kez</b> bakılıp ortalama hataya göre ağırlıklar güncelleniyor (Adam, öğrenme hızı 0,01). 800 tekrar sonunda ağırlıklar bu çiftleri tutturacak hâle geliyor.</p><p>Tabloda "tüm metin ort. hata" 0,56'da kalıyor çünkü metinde tahmin edilemeyen yerler de var (ör. <code>a+b=</code> satırında a ve b rastgele).</p>`),
  note(T,'"Yani bir fonksiyon makinesi gibi davranıyor"',`<p>Evet. <span class="pill">f(x)=2x</span> kuralını biz yazdık; burada kural <b>örneklerden bulundu</b>. Aynı girdi her zaman aynı çıktıyı verir; bir tabloda arama yok. Fark: <code>2x</code> kesin, ağ <b>yaklaşık</b> bir fonksiyon öğrendi.</p><p>tanh/softmax sayesinde yalnızca doğrusal değil, eğri ilişkileri de temsil edebiliyor. "Ne girersek girelim doğru" değil: örneklere benzeyen girdilerde güvenilir.</p>`),
  note(T,'Görmediği örnekte nasıl doğru bilebiliyor?',`<p>Yeni örneğin <b>tamamı yeni, parçaları eski</b>: <code>3</code> ve <code>8</code> başka toplamlarda görüldü, aynı E, aynı W'ler, aynı FFN kullanılıyor. Ağ ezber yerine ortak bir desen yakalayabilirse yeni örnekte de uygular (doğru uydurmanın görmediği x için tahmin yapması gibi).</p><table class="t"><tr><th>Ölçüm (eğitimde gizlenen 20 toplam)</th><th>Doğru</th></tr><tr><td>Minik GPT (3 tohum)</td><td>14 / 13 / 16</td></tr><tr><td>Pencereli MLP, sayma modeli</td><td>0–2</td></tr></table><p><b>Sınır:</b> mekanizmayı ayrıca test etmedim; yalnızca sonucu ölçtüm.</p>`),note(T,"Hedef çıktıya göre mi seçiliyor? (1 mi, 5 mi, e mi?)",`<p><b>Hedef çıktıya değil, girdiye bakılarak belli.</b> Sıra: soruyu seç → cevabını metinden bul (<code>1</code>) → soruyu ağa ver → tahmini <code>1</code> ile kıyasla. Ağın çıktısı <code>5</code> ya da <code>e</code> olsa da hedef hep <code>1</code>.</p><p>Öğretmen benzetmesi: öğrenci <code>7+5=?</code> sorusuna "e" yazdı; öğretmen "hangisine yakın" diye bakmaz, cevap anahtarında bu sorunun karşısında ne yazıyorsa onunla kıyaslar. Hedef listede <code>1</code> için %100, <code>5</code> ve <code>e</code> dahil diğer hepsi için %0 var.</p>`),
  note(T,"7, +, 5, = sırayla mı öğreniliyor?",`<p>Hayır. <code>7+5=12.</code> için <b>ayrı ayrı bağımsız örnekler</b> çıkıyor (<code>7</code>→<code>+</code>, <code>7+</code>→<code>5</code>, <code>7+5</code>→<code>=</code>, <code>7+5=</code>→<code>1</code> ...). Ağ, <code>7+5=</code>'i işlerken "az önce 7'den + tahmin ettim" diye bir şey <b>hatırlamıyor</b>; her pencere sıfırdan, tek başına işleniyor.</p>`),
  note(T,"Eğitim metin metin mi, paralel mi? (full-batch)",`<p>Bizim kodda her epoch'ta <b>727 çiftin hepsi</b> aynı (sabit) ağırlıklarla işlenip gradyanlar toplanıyor, <b>ağırlıklar epoch sonunda bir kez</b> güncelleniyor (Adam, lr 0,01). Metin metin güncelleme yok.</p><table class="t"><tr><th>Yöntem</th><th>Güncelleme</th></tr><tr><td>Full-batch (bizde)</td><td>epoch'ta 1 kez</td></tr><tr><td>Mini-batch (gerçek modeller)</td><td>birkaç yüz çiftte bir</td></tr><tr><td>Tek tek (SGD)</td><td>her çiftten sonra</td></tr></table><p>Çiftler birbirinden bağımsız olduğu için prensipte <b>paralel</b> hesaplanabilir (GPU'larda öyle); bizde tarayıcıda basitçe <code>for</code> döngüsüyle sırayla yapılıyor, sonuç aynı.</p>`),
  note(T,"Geriye yayılımda ne değişiyor? Attention'a \"doğru değer\" var mı?",`<p>Slotların değeri (x) hesapla çıktığı için doğrudan oynatılamaz; <b>tablolar</b> değişir: W_Q, W_K, W_V, W_O, W1, W2, W_out ve E, P'nin ilgili satırları, hepsi aynı anda küçük adımlarla. Yani <b>q'nun ağırlıkları (W_Q) da değişiyor</b>.</p><p>Attention için ayrı bir "doğru yüzde" etiketi <b>yok</b>; tek etiket en sondaki cevap (<code>1</code>). Hata geriye akarken attention'a "7 ve 5'e daha çok baksan hata düşerdi" sinyali olarak ulaşıyor.</p><p>Ne zaman keskinleştiği için: <a href="epoch.html" target="_blank" rel="noopener">Epoch haritası</a>.</p>`)]});

add({c:'--violet',n:'14',title:'Üretim döngüsü: tek karakterden cevap',sub:'Seçilen karakteri pencerenin sonuna ekleyip kaydırıyor, baştan çalıştırıyoruz.',
 main:()=>say('Ağ her seferinde <b>yalnızca bir karakter</b> söylüyor. "Yazıyor" gibi görünmesinin sebebi bu döngü:')+
  `<div class="vis">`+DATA.steps.map((s,i)=>`<div class="eq" style="margin:10px 0"><span class="pill">${i+1}. tur</span><div class="win">${Array.from(s.win).map(c=>`<span class="${c==='.'&&i<6?'pd':''}">${esc(c)}</span>`).join('')}</div><span class="op">→</span><div class="win"><span style="border-color:var(--violet);color:var(--violet)">${esc(s.pick)}</span></div><span class="mono" style="color:var(--mute)">${pc(s.p)}</span></div>`).join('')+`</div>`+
  kaz('Sonuç: <b>"7+5=" → "'+esc(DATA.gen)+'"</b>. Tek karakter tahmin eden bir ağdan uzun cevap çıkıyor. Büyük dil modellerinin yazması da aynı döngü.'),
 notes:()=>[
  note(K,'Döngü adım adım',`<ol style="margin:6px 0;padding-left:20px;font-size:16px;line-height:1.5"><li>Pencereyi ağa ver (adım 1–12).</li><li>En yüksek yüzdeli karakteri seç.</li><li>Seçileni pencerenin sonuna ekle, en eski karakteri at.</li><li><code>.</code> gelene kadar tekrarla.</li></ol>`),
  note(K,'Sayfada nerede?',`<p>GPT Test dersindeki Minik GPT şemasında <b>"➕ Seçileni ekle ▶"</b> düğmesi bunu yapıyor; her basışta bir tur çalışıyor.</p>`)]});

// 15 — StatQuest karşılaştırması
add({c:'--gray',n:'15',title:'StatQuest Transformer ↔ Minik GPT',sub:'Videodaki ve bizdeki adımlar aynı iskelette; farklar küçük.',
 main:()=>`<table class="t"><tr><th>Video</th><th>Minik GPT</th><th>Fark</th></tr>
  <tr><td>Word embedding</td><td>E tablosu</td><td>aynı iş (satır okuma)</td></tr>
  <tr><td>Positional encoding (sin/cos)</td><td>P tablosu</td><td>video: formül, biz: <b>öğrenilen</b></td></tr>
  <tr><td>Query, key, value</td><td>W_Q, W_K, W_V</td><td>video 2×2, biz 16×16</td></tr>
  <tr><td>Dot product (√d ile ölçekli)</td><td>q·K / 4</td><td>aynı</td></tr>
  <tr><td>Softmax → ölçekle → topla</td><td>a → Σ aᵢVᵢ</td><td>aynı</td></tr>
  <tr><td>Residual connection</td><td>r = x[9] + o·W_O</td><td>bizde ek bir W_O var</td></tr>
  <tr><td>Ek hidden katmanlı ağ</td><td>FFN (16→32→16)</td><td>aynı fikir</td></tr>
  <tr><td>Normalizasyon</td><td>yok</td><td>videoda var</td></tr>
  <tr><td>8 attention hücresi (multi-head)</td><td>1 kafa</td><td>bizde tek</td></tr>
  <tr><td>Encoder + decoder + çapraz attention</td><td>sadece decoder</td><td>video <b>çeviri</b>, biz <b>devam ettirme</b></td></tr>
  <tr><td>EOS ile başla, çıkanı geri ver, EOS gelince dur</td><td>seçileni ekle, kaydır, "." gelince dur</td><td>aynı döngü</td></tr></table>`+
  kaz('Mantık aynı: <b>kelimeyi sayıya çevir → konum ekle → kime bakacağını seç → bilgiyi topla → işle → sıradakini seç</b>.'),
 notes:()=>[
  note(K,'Videoda olup bizde olmayanlar',`<p><b>Encoder-decoder (çapraz) attention:</b> decoder'ın "girdideki hangi kelimeye bakayım" demesi. Self-Attention dersindeki "Self mi çapraz mı?" bölümü bunu anlatıyor.</p><p><b>Multi-head</b> ve <b>normalizasyon</b> da yok. Bunlar gerçek modellerde var.</p>`),
  note(K,'Video neden "q her kelime için"?',`<p>Çünkü encoder her kelime için yeni bir kodlama üretiyor. Bizde sadece son slotun çıktısı lazım olduğu için tek q yetiyor; hesabı kısaltan bir sadeleştirme.</p>`)]});

/* ---------- DOM ---------- */
const world=document.getElementById('world');
const rowEls=[];
STEPS.forEach((s,i)=>{
  const R=document.createElement('section');R.className='row';R.dataset.i=i;R.style.setProperty('--c','var('+s.c+')');
  R.innerHTML=`<div class="main"><span class="badge"><b>${s.n}</b> Adım</span><h2>${esc(s.title)}</h2><p class="sub">${esc(s.sub)}</p>${s.main()}</div><div class="side">${s.notes().join('')}</div>`;
  world.appendChild(R);rowEls.push(R);
  if(i<STEPS.length-1){const A=document.createElement('div');A.className='arr';A.style.setProperty('--c','var('+STEPS[i+1].c+')');
    A.innerHTML=`<svg width="40" height="96" viewBox="0 0 40 96"><line x1="20" y1="2" x2="20" y2="80" stroke="currentColor" stroke-width="3.5"/><path d="M8 72L20 92L32 72z" fill="currentColor"/></svg><span>${esc(ARROWS[i]||'')}</span>`;world.appendChild(A);}
});

// baloncuklar
const chipsEl=document.getElementById('chips');
if(chipsEl)STEPS.slice(1).forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--cc','var('+s.c+')');b.innerHTML=`<small>${s.n}</small>${esc(s.title.replace(/:.*/,'').slice(0,34))}`;b.onclick=()=>gotoStep(j+1);chipsEl.appendChild(b)});
// gezinme listesi
const nav=document.getElementById('nav');
STEPS.forEach((s,i)=>{const b=document.createElement('button');b.style.setProperty('--cc','var('+s.c+')');b.innerHTML=`<b>${s.n}</b><span>${esc(s.title)}</span>`;b.onclick=()=>{gotoStep(i);nav.classList.remove('open')};nav.appendChild(b)});
// kamera
const vp=document.getElementById('vp');let cam={x:0,y:0,k:1},cur=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function apply(anim){world.classList.toggle('anim',!!anim);world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`}
function zoomAt(px,py,nk){nk=clamp(nk,.04,3);const q=nk/cam.k;cam.x=px-(px-cam.x)*q;cam.y=py-(py-cam.y)*q;cam.k=nk}
function fitAll(anim){const vw=vp.clientWidth,k=Math.min(vw/world.offsetWidth,1);cam.k=k;cam.x=(vw-world.offsetWidth*k)/2;cam.y=60;apply(anim)}
function gotoStep(i,anim=true){i=clamp(i,0,STEPS.length-1);cur=i;const el=rowEls[i],vw=vp.clientWidth,vh=vp.clientHeight,narrow=vw<760;
  const tw=narrow?el.querySelector('.main').offsetWidth:el.offsetWidth;
  const k=Math.min((vw-(narrow?24:80))/tw,1.1);cam.k=k;cam.x=(narrow?12:(vw-tw*k)/2)-el.offsetLeft*k;
  const h=el.offsetHeight*k,top=vh>h+150?(vh-h)/2+30:78;cam.y=top-el.offsetTop*k;apply(anim);
  document.getElementById('cur').textContent='Adım '+STEPS[i].n+' / '+(STEPS.length-1)}
document.getElementById('zi').onclick=()=>{zoomAt(vp.clientWidth/2,vp.clientHeight/2,cam.k*1.35);apply(true)};
document.getElementById('zo').onclick=()=>{zoomAt(vp.clientWidth/2,vp.clientHeight/2,cam.k/1.35);apply(true)};
document.getElementById('fit').onclick=()=>fitAll(true);
document.getElementById('prev').onclick=()=>gotoStep(cur-1);
document.getElementById('next').onclick=()=>gotoStep(cur+1);
document.getElementById('cur').onclick=()=>nav.classList.toggle('open');
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){gotoStep(cur+1);e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){gotoStep(cur-1);e.preventDefault()}else if(e.key==='+'||e.key==='='){document.getElementById('zi').click()}else if(e.key==='-'){document.getElementById('zo').click()}else if(e.key==='0'){fitAll(true)}});
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,cam.k*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)));apply(false)},{passive:false});
const ptr=new Map();let last=null;
vp.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,#nav'))return;vp.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.classList.add('dragging');last=null});
vp.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId),pts=[...ptr.values()];
  if(ptr.size===1){cam.x+=e.clientX-p.x;cam.y+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;apply(false)}
  else if(ptr.size===2){const o=pts.find(q=>q!==p);const d0=Math.hypot(p.x-o.x,p.y-o.y);p.x=e.clientX;p.y=e.clientY;const d1=Math.hypot(p.x-o.x,p.y-o.y),r=vp.getBoundingClientRect();if(d0>0)zoomAt((p.x+o.x)/2-r.left,(p.y+o.y)/2-r.top,cam.k*d1/d0);apply(false)}});
const up=e=>{ptr.delete(e.pointerId);if(!ptr.size)vp.classList.remove('dragging')};
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('dblclick',e=>{const r=e.target.closest('.row');if(r)gotoStep(+r.dataset.i)});
window.addEventListener('resize',()=>gotoStep(cur,false));
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>gotoStep(0,false));
gotoStep(0,false);
</script>

</body></html>
